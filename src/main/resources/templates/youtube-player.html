<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube Audio Player</title>
    <link th:href="@{/css/youtube.css}" rel="stylesheet" />
</head>

<body>
    <div th:replace="~{fragments/header}"></div>
     <div class="header">
            <h1 class="music-title">YouTube Audio Player</h1>
        </div>
    <!-- Header placeholder -->
    <div class="upload-page">
       

        <div class="contentSongList">
            <!-- Bên trái: sound wave -->
            <div class="visualizer">
                <div id="video-info" style="display:none;">
                    <div class="thumbnail">
                        <div class="glow"></div>
                        <div class="glow2"></div>
                        <img id="video-thumbnail" src="" alt="YouTube Thumbnail">
                        
                    </div>
                    <hr>
                    <div id="video-title">Đang tải thông tin video...</div>
                    <hr>
                    <p id="video-id"></p>
                </div>
                <!-- <canvas id="sound-visualizer" width="700" height="700"></canvas> -->
            </div>

            <!-- Bên phải: controls -->
            <div class="song-section">
                <!-- URL Input -->
                <div class="url-input">
                    <input type="text" id="youtube-url"
                        placeholder="Dán link YouTube vào đây (ví dụ: https://www.youtube.com/watch?v=...)">
                    <button onclick="loadVideo()">🎵 Tải nhạc</button>
                </div>

                <!-- Status -->
                <div class="status" id="status">Nhập URL YouTube để bắt đầu</div>

                <!-- Video Info -->
                <div class="video-info" id="video-info" style="display: none;">
                    <!-- <div class="video-title" id="video-title">Đang tải thông tin video...</div>-->
                    <div class="video-id" id="video-id"></div>
                </div>

                <!-- Controls -->
                <div class="controls" id="controls" style="display: none;">
                    <!-- Button Controls -->
                    <div class="button-group">
                        <button class="btn btn-play" onclick="play()">
                            ▶️ Play
                        </button>
                        <button class="btn btn-pause" onclick="pause()">
                            ⏸️ Pause
                        </button>
                        <button class="btn btn-stop" onclick="stop()">
                            ⏹️ Stop
                        </button>
                    </div>

                    <!-- Time Display -->
                    <div class="time-display" id="time-display">0:00 / 0:00</div>

                    <!-- Seek Bar -->
                    <div class="control-group">
                        <label>Tua nhạc:</label>
                        <div class="slider-container">
                            <span style="font-size: 12px; color: #b3b3b3;">0:00</span>
                            <input type="range" class="slider" id="seek" min="0" max="100" value="0">
                            <span id="duration-display" style="font-size: 12px; color: #b3b3b3;">0:00</span>
                        </div>
                    </div>

                    <!-- Volume Control -->
                    <div class="control-group">
                        <label>Âm lượng:</label>
                        <div class="slider-container">
                            <span>🔊</span>
                            <input type="range" class="slider" id="volume" min="0" max="100" value="50">
                            <span class="volume-display" id="volume-display">50%</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Hidden YouTube Player -->
        <div id="player"></div>

        <!-- Player bar cố định (placeholder) -->
        <div class="player-bar">
            <div style="color: #b3b3b3; font-size: 14px;">
                Sử dụng controls ở trên để điều khiển nhạc
            </div>
        </div>
    </div>

    <!-- Scripts  YouTube IFrame Player AP-->
    <script src="https://www.youtube.com/iframe_api"></script>
    <script th:src="@{/js/youtube.js}"></script>

</body>

</html>
